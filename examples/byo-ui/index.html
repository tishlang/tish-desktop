<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BYO UI</title>
    <style>
      :root {
        --bg: #0f1419;
        --fg: #e7ecf1;
        --muted: #8b9aab;
        --accent: #3d9a6e;
        --panel: #1a222c;
      }
      html, body, #root { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); }
      body { font-family: "IBM Plex Sans", "Segoe UI", sans-serif; }
      #root { padding: 2rem; max-width: 40rem; }
      h1 { font-size: 2rem; letter-spacing: -0.03em; margin: 0 0 0.5rem; }
      .muted { color: var(--muted); font-size: 0.9rem; }
      .row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 1.25rem 0; }
      button {
        background: var(--accent); color: #04140c; border: 0; border-radius: 6px;
        padding: 0.55rem 0.9rem; font-weight: 600; cursor: pointer;
      }
      button:hover { filter: brightness(1.08); }
      pre {
        background: var(--panel); padding: 1rem; border-radius: 8px;
        overflow: auto; font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/bridge-boot.js"></script>
    <script type="module" src="/ui/main.tish"></script>
  </body>
</html>
