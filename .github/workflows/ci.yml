name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  tish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps
        run: npm install
      - name: Format check
        run: npm run format:check
        continue-on-error: true
      - name: Lint Tish
        run: npm run lint:tish
        continue-on-error: true
      - name: Bare / BYO example must not depend on lattish
        run: npm run check:bare-deps

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Checkout tish core (path dep)
        uses: actions/checkout@v4
        with:
          repository: tishlang/tish
          path: ../tish
      - name: Checkout tish-apple (platform-apple path dep)
        uses: actions/checkout@v4
        with:
          repository: tishlang/tish-apple
          path: ../tish-apple
      - name: Install local tish CLI
        run: cargo install --path ../tish/crates/tish --force --bin tish
      - name: Check (default features)
        run: cargo check -p tish_desktop -p tish_app
      - name: Check platform-apple feature gates (compile metadata)
        # Full link of tish-macos needs macOS; ensure the feature resolves on Linux.
        run: cargo check -p tish_desktop --features platform-apple
        continue-on-error: true
      - name: Checkout tish-android (optional stub host)
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: tishlang/tish-android
          path: ../tish-android
      - name: Check platform-android stub
        continue-on-error: true
        run: |
          if [ -f ../tish-android/crates/tish-android/Cargo.toml ]; then
            cargo check -p tish_desktop --features platform-android
          else
            echo "tish-android not available; skip"
          fi
      - name: Typed shell --check warn (byo-ui + hybrid)
        run: |
          npm --prefix examples/byo-ui install
          npm --prefix examples/hybrid install
          npm --prefix examples/byo-ui run build:shell
          npm --prefix examples/hybrid run build:shell
      - name: Prove attach_app wiring references
        run: |
          rg -n "attach_app|broadcast_event" crates/tish_desktop/src/platform/apple.rs crates/tish_desktop/src/local_invoke.rs

  rust-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Checkout tish core
        uses: actions/checkout@v4
        with:
          repository: tishlang/tish
          path: ../tish
      - name: Checkout tish-apple
        uses: actions/checkout@v4
        with:
          repository: tishlang/tish-apple
          path: ../tish-apple
      - name: Check with platform-apple
        run: cargo check -p tish_desktop --features platform-apple -p tish_app
      - name: Install tish CLI + hybrid apple shell build
        run: |
          cargo install --path ../tish/crates/tish --force --bin tish
          npm --prefix examples/hybrid install
          npm --prefix examples/hybrid run build:shell:apple
      - name: hello-ios staticlib (BrokerCore + tish:ios host)
        run: |
          npm --prefix examples/hello-ios install
          npm --prefix examples/hello-ios run build
