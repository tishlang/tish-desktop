name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  tish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps
        run: npm install
      - name: Format check
        run: npm run format:check
        continue-on-error: true
      - name: Lint Tish
        run: npm run lint:tish
        continue-on-error: true

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Checkout tish core (path dep / patch)
        uses: actions/checkout@v4
        with:
          repository: tishlang/tish
          path: ../tish
        continue-on-error: true
      - name: Check
        run: cargo check -p tish_desktop
        continue-on-error: true
