name: CI

on:
  pull_request:
  push:
    branches: [main, master]

# This workflow costs ~35 runner-minutes, so a rapid re-push otherwise doubles it while the
# first run is already obsolete. Same shape as tish's native-smoke.yml.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  tish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps
        run: npm install
      - name: Format check
        run: npm run format:check
      - name: Lint Tish
        run: npm run lint:tish
        continue-on-error: true
      - name: Bare / BYO example must not depend on lattish
        run: npm run check:bare-deps

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # `tish build --native-backend rust` generates a crate and shells out to cargo. Its default
      # nested profile is lto="fat" + codegen-units=1 + strip — the slowest possible release
      # config, for binaries CI only ever compiles and links, never runs or measures. This flag
      # switches to opt-level=1 / lto=false / codegen-units=16 / incremental, and enables mold
      # on Linux. Release artifacts are built elsewhere and are unaffected.
      TISH_FAST_NATIVE_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
      # Pinned to the toolchain the project develops against, so CI and local builds
      # resolve the same rustc. Keep both rust jobs on the same version.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.0"
          components: rustfmt, clippy

      # NOTE: deliberately no sccache. `tish build --native-backend rust` strips RUSTC_WRAPPER
      # (tish_build_utils::run_cargo_build env_removes it), so it cannot help the steps that
      # dominate this job — and tish's own http-perf.yml / native-smoke.yml document it flaking
      # exactly that nested compile. rust-cache is the mechanism that works here.
      - name: Cache cargo
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          cache-workspace-crates: "true"

      - name: Install Tauri Linux system deps
        # Tauri's Linux (gtk/webkit/glib/soup) build-scripts need these dev packages;
        # without them cargo fails with "Package glib-2.0 was not found in pkg-config".
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            librsvg2-dev libayatana-appindicator3-dev \
            build-essential file libssl-dev
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Checkout path-dep siblings
        id: siblings
        uses: ./.github/actions/tish-siblings
        with:
          head-ref: ${{ github.head_ref }}

      # The nested cargo target dir the tish compiler uses for the example shells: it resolves to
      # <runtime crate>/../../target — inside the npm package — and is only used if that directory
      # already EXISTS, else every `tish build` gets its own scratch target and recompiles Tauri.
      - name: Cache the tish nested target dir
        uses: actions/cache@v4
        with:
          path: examples/*/node_modules/@tishlang/tish/target
          key: tish-nested-target-${{ runner.os }}-${{ hashFiles('examples/*/package.json') }}
          restore-keys: |
            tish-nested-target-${{ runner.os }}-

      - name: Check (default features)
        run: cargo check -p tishlang_desktop -p tishlang_app
      # platform-apple is NOT checked here. It pulls objc2, which is a hard
      # `compile_error!` off Apple targets, so the step could only ever be red-and-ignored.
      # The rust-macos job compile-checks that feature for real.
      # platform-ms / platform-lin / platform-android are not compile-tested either: their
      # host crates have no public repo, only the resolution stubs. The default check
      # here plus the macOS job exercise the real, buildable configurations.

      - name: Typed shell --check warn (hybrid)
        # hybrid is the richest shell (Phase 2 tree + SC4), so it is the one PRs always build.
        run: |
          npm --prefix examples/hybrid install
          mkdir -p examples/hybrid/node_modules/@tishlang/tish/target
          npm --prefix examples/hybrid run build:shell

      - name: Typed shell --check warn (byo-ui + basic)
        # These two exercise the same host through thinner surfaces. They add ~7 min for little
        # extra signal on a PR, so they run on main — where a regression still lands before any
        # release — and on demand via the run-all-examples label.
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-all-examples')
        run: |
          npm --prefix examples/byo-ui install
          npm --prefix examples/basic install
          mkdir -p examples/byo-ui/node_modules/@tishlang/tish/target
          mkdir -p examples/basic/node_modules/@tishlang/tish/target
          npm --prefix examples/byo-ui run build:shell
          npm --prefix examples/basic run build:shell

      - name: Hybrid Phase 2 tree + SC4 scripts
        run: npm --prefix examples/hybrid run check:tree
      - name: Doctor smoke (resolve + cap matrix)
        working-directory: examples/hybrid
        run: |
          IMPORTER="$(pwd)/app/App.tish"
          node ../../cli/bin/mode.js doctor \
            --platform macos --surface webview \
            --resolve ./Button --importer "$IMPORTER"
      - name: Prove attach_app wiring references
        # grep, not rg: ripgrep is not on the ubuntu-latest image.
        run: |
          grep -nE "attach_app|broadcast_event" \
            crates/tish_desktop/src/platform/apple.rs \
            crates/tish_desktop/src/local_invoke.rs

  rust-macos:
    runs-on: macos-15
    timeout-minutes: 45
    # `tish build --target native` (tish_build_utils::run_cargo_build) appends
    # `-C target-cpu=native` unless RUSTFLAGS already pins a target-cpu. GitHub's
    # Apple-Silicon runners are virtualized, LLVM cannot identify the host core, and
    # `native` degrades to `generic` — which drops `aes`/`sha2` from the aarch64 feature
    # set that aarch64-apple-darwin normally guarantees. ring then fails const-eval:
    #   assertion failed: (CAPS_STATIC & MIN_STATIC_FEATURES) == MIN_STATIC_FEATURES
    #   assertion failed: CAPS_STATIC == MIN_STATIC_FEATURES
    # Not a rustc-version or ring-version problem (there is no ring > 0.17.14): pin the
    # CPU to apple-m1, which is exactly rustc's own default for this target and the
    # floor for every Apple-Silicon runner, so the flag is a no-op on real hardware.
    env:
      RUSTFLAGS: "-C target-cpu=apple-m1"
      # See the rust job — fast nested profile for compile-and-link verification.
      TISH_FAST_NATIVE_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
      # Pinned to the toolchain the project develops against (same as the rust job).
      # aarch64-apple-ios-sim is needed by the hello-ios staticlib step.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.0"
          targets: aarch64-apple-ios-sim

      # No sccache here either — see the rust job.
      - name: Cache cargo
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          cache-workspace-crates: "true"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Record host CPU detection
        # Diagnostic: shows what `-C target-cpu=native` would have resolved to on this
        # runner, so a future recurrence is one log line away from being explained.
        run: |
          rustc --print target-cpus --target aarch64-apple-darwin | head -3
          rustc --print cfg -C target-cpu=native --target aarch64-apple-darwin \
            | grep -E 'target_feature="(neon|aes|sha2|sha3)"' || true

      - name: Checkout path-dep siblings
        id: siblings
        uses: ./.github/actions/tish-siblings
        with:
          head-ref: ${{ github.head_ref }}

      # The nested cargo target dir the tish compiler uses for the example shells: it resolves to
      # <runtime crate>/../../target — inside the npm package — and is only used if that directory
      # already EXISTS, else every `tish build` gets its own scratch target and recompiles Tauri.
      - name: Cache the tish nested target dir
        uses: actions/cache@v4
        with:
          path: examples/*/node_modules/@tishlang/tish/target
          key: tish-nested-target-${{ runner.os }}-${{ hashFiles('examples/*/package.json') }}
          restore-keys: |
            tish-nested-target-${{ runner.os }}-


      - name: Check with platform-apple
        run: cargo check -p tishlang_desktop --features platform-apple -p tishlang_app

      - name: Hybrid apple shell build (SC4)
        run: |
          npm --prefix examples/hybrid install
          mkdir -p examples/hybrid/node_modules/@tishlang/tish/target
          npm --prefix examples/hybrid run check:tree
          npm --prefix examples/hybrid run build:shell:apple
          test -x examples/hybrid/dist/hybrid-shell-apple

      - name: hello-ios staticlib (BrokerCore + tish:ios host)
        # Cross-compiles to aarch64-apple-ios-sim, so it shares nothing with the host builds
        # above and costs ~4 min. Runs on main and on demand rather than on every PR.
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-all-examples')
        run: |
          npm --prefix examples/hello-ios install
          npm --prefix examples/hello-ios run build
