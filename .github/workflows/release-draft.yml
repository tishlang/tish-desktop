name: Release draft (build)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release artifacts
        # macOS: pin target-cpu so `tish build` does not fall back to
        # `-C target-cpu=native`, which degrades to `generic` on GitHub's virtualized
        # Apple-Silicon runners and breaks ring's const-eval feature assertions.
        # See the rust-macos job in ci.yml for the full write-up.
        env:
          RUSTFLAGS: ${{ runner.os == 'macOS' && '-C target-cpu=apple-m1' || '' }}
        run: node scripts/distribute/build-release.mjs --platform ${{ runner.os }}
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: dist/release/**
        continue-on-error: true
