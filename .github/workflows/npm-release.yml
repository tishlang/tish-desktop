# Publish @tishlang/tish-desktop* packages to npm when a GitHub release is promoted from
# prerelease to full release. Mirrors tish/.github/workflows/npm-release.yml.
#
# Packages are published sequentially (shared → desktop-api → app-api → …) so
# intra-scope version deps resolve on first release.
#
# AUTH: npm OIDC trusted publishing (no long-lived NPM_TOKEN). One-time setup on
# npmjs.com for EACH package below — Settings → Trusted Publisher → GitHub Actions:
#   Organization or user: tishlang
#   Repository:           tish-desktop
#   Workflow filename:    npm-release.yml
#   Environment:          (leave blank)
# Requires npm >= 11.5.1 (upgraded below) and id-token: write.

name: NPM release

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)publish, e.g. v0.1.0"
        required: true
        type: string

jobs:
  publish:
    name: Publish @tishlang/tish-desktop*
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NPM_CONFIG_PROVENANCE: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for OIDC trusted publishing (needs >= 11.5.1)
        run: |
          # Pin to npm 11.x — same rationale as tish npm-release.yml.
          npm install -g "npm@^11"
          npm --version

      - name: Publish packages (dependency order)
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          VERSION="${TAG#v}"
          # shared first (no intra-scope deps), then dependents, then cli.
          PACKAGES=(
            "packages/shared:@tishlang/tish-desktop-shared"
            "packages/desktop-api:@tishlang/tish-desktop-api"
            "packages/app-api:@tishlang/tish-app-api"
            "packages/ui-theme:@tishlang/tish-desktop-ui-theme"
            "cli:@tishlang/tish-desktop"
          )

          publish_one() {
            local dir="$1" npm_name="$2"
            if npm view "${npm_name}@${VERSION}" version >/dev/null 2>&1; then
              echo "::notice::${npm_name}@${VERSION} is already published — skipping."
              return 0
            fi
            rm -rf /tmp/publish-pkg
            cp -r "$dir" /tmp/publish-pkg
            # Ship PIF license text with every tarball.
            cp LICENSE /tmp/publish-pkg/LICENSE
            (
              cd /tmp/publish-pkg
              VERSION="$VERSION" node -e "
                const fs = require('fs');
                const version = process.env.VERSION;
                const p = require('./package.json');
                delete p.private;
                p.version = version;
                p.publishConfig = Object.assign({ access: 'public' }, p.publishConfig || {});
                const rewrite = (deps) => {
                  if (!deps) return;
                  for (const [k, v] of Object.entries(deps)) {
                    if (typeof v === 'string' && (v.startsWith('file:') || v.startsWith('workspace:'))) {
                      const ours = new Set([
                        '@tishlang/tish-desktop',
                        '@tishlang/tish-desktop-api',
                        '@tishlang/tish-app-api',
                        '@tishlang/tish-desktop-shared',
                        '@tishlang/tish-desktop-ui-theme',
                      ]);
                      if (ours.has(k)) deps[k] = version;
                    }
                  }
                };
                rewrite(p.dependencies);
                rewrite(p.devDependencies);
                rewrite(p.peerDependencies);
                if (!Array.isArray(p.files)) p.files = [];
                if (!p.files.includes('LICENSE')) p.files.push('LICENSE');
                fs.writeFileSync('./package.json', JSON.stringify(p, null, 2) + '\n');
              "
              npm publish --access public
            )
          }

          for entry in "${PACKAGES[@]}"; do
            dir="${entry%%:*}"
            name="${entry#*:}"
            echo "=== Publishing $name from $dir ==="
            publish_one "$dir" "$name"
          done

  update-release:
    name: Update release description
    needs: publish
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false) && github.event_name == 'release' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Update release description with npm URLs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          CLI_URL="https://www.npmjs.com/package/@tishlang/tish-desktop/v/${VERSION}"
          API_URL="https://www.npmjs.com/package/@tishlang/tish-desktop-api/v/${VERSION}"
          APP_API_URL="https://www.npmjs.com/package/@tishlang/tish-app-api/v/${VERSION}"
          SHARED_URL="https://www.npmjs.com/package/@tishlang/tish-desktop-shared/v/${VERSION}"
          THEME_URL="https://www.npmjs.com/package/@tishlang/tish-desktop-ui-theme/v/${VERSION}"
          CRATES_URL="https://crates.io/crates/tish_desktop/${VERSION}"
          RELEASE_ID="${{ github.event.release.id }}"
          REPO="${{ github.repository }}"
          CURRENT_BODY=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${REPO}/releases/${RELEASE_ID}" | jq -r '.body // ""')
          if printf '%s' "$CURRENT_BODY" | grep -q "Published to npm:"; then
            echo "Release body already lists npm URLs — nothing to do."
            exit 0
          fi
          NEW_BODY="${CURRENT_BODY}

          ---
          Published to npm: ${CLI_URL}
          desktop-api: ${API_URL}
          app-api: ${APP_API_URL}
          shared: ${SHARED_URL}
          ui-theme: ${THEME_URL}
          crates.io: ${CRATES_URL}"
          curl -s -X PATCH \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/releases/${RELEASE_ID}" \
            -d "$(printf '%s' "$NEW_BODY" | jq -Rs '{body: .}')"
