# Publish tishlang_broker → tishlang_desktop → tishlang_app to crates.io when a GitHub
# release is promoted from prerelease to full release. Mirrors
# tish/.github/workflows/crates-release.yml.
#
# Cross-repo deps (tishlang_core, tishlang_macos) are plain versioned crates.io deps in
# Cargo.toml, so nothing about them needs rewriting here. Only the in-workspace
# publish-order deps do — see crates/tish_desktop/README.md. The not-yet-published
# ms/lin/android siblings are still stripped until those repos exist.
#
# Secret: CARGO_REGISTRY_TOKEN (crates.io API token) on this repo.

name: Crates.io release

on:
  release:
    types: [published, edited]
  # Resume a throttled / partial run: already-published versions are skipped.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)publish, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Publish to crates.io
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false }}
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set versions and registry deps
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          VERSION="${TAG#v}"

          # NOTE: crate names are tishlang_*, but the directories under crates/ keep their
          # original tish_* spelling (same split as tish-apple: tishlang_macos in crates/tish-macos).
          # Iterate DIRECTORIES here, not crate names.
          for dir in tish_broker tish_desktop tish_app; do
            sed -i.bak "s/^version = .*/version = \"$VERSION\"/" "crates/$dir/Cargo.toml"
            rm -f "crates/$dir/Cargo.toml.bak"
          done

          # Intra-workspace deps keep the path AND gain a version (publish order:
          # broker → desktop → app). Cargo resolves these locally through the path and emits
          # only the version into the published .crate. Stripping the path instead makes the
          # workspace unresolvable during the very first publish, because the version being
          # referenced is the one this run is in the middle of uploading:
          #   error: no matching package named `tishlang_broker` found
          perl -i -0pe "s/tishlang_broker = \\{ path = \"([^\"]+)\" \\}/tishlang_broker = { path = \"\$1\", version = \"$VERSION\" }/s" \
            crates/tish_desktop/Cargo.toml
          perl -i -0pe "s/tishlang_desktop = \\{ path = \"([^\"]+)\" \\}/tishlang_desktop = { path = \"\$1\", version = \"$VERSION\" }/s" \
            crates/tish_app/Cargo.toml

          # The remaining sibling host path deps (ms/lin/android) are monorepo-only — those repos
          # aren't published yet. Strip them and their feature gates so the crate publishes cleanly;
          # apple is kept (versioned above). Re-add a sibling here once its repo is on crates.io.
          python3 <<'PY'
          from pathlib import Path
          import re
          p = Path("crates/tish_desktop/Cargo.toml")
          text = p.read_text()
          # Drop optional sibling host dependency lines (apple kept — versioned above).
          text = re.sub(
              r'^tish-(ms|lin|android)\s*=\s*\{[^\}]*\}\s*\n',
              "",
              text,
              flags=re.M,
          )
          # Drop feature lines that only enabled those deps (platform-apple kept).
          text = re.sub(
              r'^platform-(ms|lin|android)\s*=\s*\[[^\]]*\]\s*\n',
              "",
              text,
              flags=re.M,
          )
          # Drop feature = ["dep:…"] leftovers if any remain empty.
          p.write_text(text)
          print("--- crates/tish_desktop/Cargo.toml (publish) ---")
          print(p.read_text())
          PY

          # Mirror feature strip on tishlang_app alias crate (platform-apple kept — forwards to
          # tishlang_desktop/platform-apple, which is now published).
          python3 <<'PY'
          from pathlib import Path
          import re
          p = Path("crates/tish_app/Cargo.toml")
          text = p.read_text()
          text = re.sub(
              r'^platform-(ms|lin|android)\s*=\s*\[[^\]]*\]\s*\n',
              "",
              text,
              flags=re.M,
          )
          p.write_text(text)
          PY

          grep -E '^(version|name) =|tishlang_core|tishlang_broker|tishlang_desktop' \
            crates/tish_broker/Cargo.toml \
            crates/tish_desktop/Cargo.toml \
            crates/tish_app/Cargo.toml

      - name: Publish crates (dependency order)
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          VERSION="${TAG#v}"
          CRATES=(tishlang_broker tishlang_desktop tishlang_app)
          UA="tish-desktop-release/1.0 (https://github.com/tishlang/tish-desktop)"

          # Drift guard: every publishable workspace crate MUST be listed above.
          missing=0
          while IFS= read -r c; do
            printf '%s\n' "${CRATES[@]}" | grep -qx "$c" \
              || { echo "::error::publishable crate '$c' is missing from the CRATES list in crates-release.yml"; missing=1; }
          done < <(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.publish == null or (.publish | length > 0)) | .name')
          [ "$missing" -eq 0 ] || { echo "Add the crate(s) above to CRATES in dependency order, then re-run."; exit 1; }

          publish_with_retry() {
            local crate="$1" max="${PUBLISH_MAX_ATTEMPTS:-6}" attempt log after tgt now wait
            log=$(mktemp)
            for attempt in $(seq 1 "$max"); do
              if cargo publish -p "$crate" --token "$CARGO_REGISTRY_TOKEN" --no-verify --allow-dirty >"$log" 2>&1; then
                cat "$log"; rm -f "$log"; return 0
              fi
              cat "$log"
              if ! grep -qiE '429|too many|rate.?limit|try again (later|after)' "$log"; then
                # The publish order interleaves this repo with tishlang/tish-apple, so a missing
                # cross-repo dependency is an EXPECTED intermediate state, not a broken release.
                # Say so, with the exact next step, instead of leaving a bare cargo error.
                if grep -q 'no matching package named `tishlang_macos`' "$log"; then
                  echo "::error::$crate needs tishlang_macos on crates.io first. The release order spans two repos: (1) this workflow publishes tishlang_broker, (2) run tishlang/tish-apple's Crates.io release for tishlang_apple_common + tishlang_macos + tishlang_ios, (3) re-dispatch this workflow with tag=${TAG} — already-published crates are skipped, so it resumes at $crate."
                else
                  echo "::error::cargo publish $crate failed (not a rate limit) — see log above"
                fi
                rm -f "$log"; return 1
              fi
              after=$(grep -oiE 'try again after [^.]*(GMT|UTC)' "$log" | head -1 | sed -E 's/.*try again after //I' || true)
              wait=""
              if [ -n "$after" ]; then
                now=$(date -u +%s)
                tgt=$(date -u -d "$after" +%s 2>/dev/null || echo "")
                [ -n "$tgt" ] && wait=$(( tgt - now + 5 ))
              fi
              if [ -z "$wait" ] || [ "$wait" -lt 1 ]; then wait=60; fi
              if [ "$wait" -gt 180 ]; then wait=180; fi
              echo "::warning::$crate hit a crates.io rate limit (attempt ${attempt}/${max}); waiting ${wait}s then retrying"
              sleep "$wait"
            done
            echo "::error::$crate still rate-limited after ${max} attempts. Re-dispatch (Actions → Crates.io release → Run workflow, tag=${TAG})."
            rm -f "$log"; return 1
          }

          # Cross-repo ordering gate. The CRATES array above orders THIS workspace, the way
          # tish's crates-release.yml orders its own — but this ecosystem's graph spans two
          # repos and interleaves:
          #
          #   tishlang_broker (here) -> tishlang_apple_common/_macos/_ios (tish-apple)
          #                          -> tishlang_desktop, tishlang_app (here)
          #
          # tishlang_desktop keeps tishlang_macos as an optional platform-apple dep, and cargo
          # requires optional deps to resolve at publish time. So the run must pause after the
          # broker until tish-apple's release lands, rather than failing with a bare
          # "no matching package named `tishlang_macos` found" and needing a manual re-dispatch.
          # Same spirit as the drift guard: make the ordering explicit and enforced.
          require_published() {
            local dep="$1" for_crate="$2" max="${CROSS_REPO_WAIT_SECS:-1800}" waited=0
            while ! curl -sf -o /dev/null -A "$UA" "https://crates.io/api/v1/crates/${dep}"; do
              if [ "$waited" -ge "$max" ]; then
                echo "::error::${for_crate} needs ${dep} on crates.io and it has not appeared after ${max}s. Run tishlang/tish-apple's Crates.io release, then re-dispatch this workflow with tag=${TAG} — already-published crates are skipped, so it resumes at ${for_crate}."
                return 1
              fi
              echo "::notice::waiting for ${dep} on crates.io before publishing ${for_crate} (${waited}s/${max}s) — this is tishlang/tish-apple's Crates.io release"
              sleep 30
              waited=$(( waited + 30 ))
            done
            echo "${dep} is on crates.io — continuing with ${for_crate}"
          }

          for crate in "${CRATES[@]}"; do
            if curl -sSf -o /dev/null -A "$UA" "https://crates.io/api/v1/crates/${crate}/${VERSION}"; then
              echo "Skipping $crate v${VERSION} (already published)"
              continue
            fi
            # Gate on the sibling repo's crates before the ones that need them.
            case "$crate" in
              tishlang_desktop) require_published tishlang_macos "$crate" || exit 1 ;;
            esac
            echo "Publishing $crate v${VERSION}..."
            publish_with_retry "$crate"
          done

      - name: Update release description with crates.io URL
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          VERSION="${TAG#v}"
          CRATES_URL="https://crates.io/crates/tishlang_desktop/${VERSION}"
          RELEASE_ID="${{ github.event.release.id }}"
          REPO="${{ github.repository }}"
          CURRENT_BODY=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${REPO}/releases/${RELEASE_ID}" | jq -r '.body // ""')
          if printf '%s' "$CURRENT_BODY" | grep -q "crates.io/crates/tishlang_desktop"; then
            echo "Release body already has crates.io link"
          else
            NEW_BODY="${CURRENT_BODY}

          ---
          Published to crates.io: ${CRATES_URL} (also tishlang_broker, tishlang_app)"
            curl -s -X PATCH \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/releases/${RELEASE_ID}" \
              -d "$(printf '%s' "$NEW_BODY" | jq -Rs '{body: .}')"
          fi
