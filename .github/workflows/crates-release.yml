# Publish tish_broker → tish_desktop → tish_app to crates.io when a GitHub
# release is promoted from prerelease to full release. Mirrors
# tish/.github/workflows/crates-release.yml.
#
# Local/monorepo builds keep path deps on tishlang_core + sibling hosts.
# This workflow rewrites those for publish — see crates/tish_desktop/README.md.
# tishlang_macos (platform-apple) is published from tishlang/tish-apple, so it is
# rewritten to a versioned crates.io dep here (NOT stripped); the not-yet-published
# ms/lin/android siblings are still stripped until those repos exist.
#
# Secret: CARGO_REGISTRY_TOKEN (crates.io API token) on this repo.

name: Crates.io release

on:
  release:
    types: [published, edited]
  # Resume a throttled / partial run: already-published versions are skipped.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)publish, e.g. v0.1.0"
        required: true
        type: string
      tishlang_core_version:
        description: "crates.io tishlang_core version (semver req)"
        required: false
        default: "3.0"
        type: string
      tish_apple_version:
        description: "crates.io tishlang_macos (tish-apple) version (semver req)"
        required: false
        default: "3.0"
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Publish to crates.io
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false }}
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      # Pin must match the published tish CLI / ecosystem train.
      TISHLANG_CORE_VERSION: ${{ inputs.tishlang_core_version || '3.0' }}
      # tishlang_macos (platform-apple) published version from tishlang/tish-apple.
      TISH_APPLE_VERSION: ${{ inputs.tish_apple_version || '3.0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set versions and registry deps
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          VERSION="${TAG#v}"
          CORE="${TISHLANG_CORE_VERSION}"
          APPLE="${TISH_APPLE_VERSION}"

          for crate in tish_broker tish_desktop tish_app; do
            sed -i.bak "s/^version = .*/version = \"$VERSION\"/" "crates/$crate/Cargo.toml"
            rm -f "crates/$crate/Cargo.toml.bak"
          done

          # Path dep → versioned crates.io (cargo publish rejects path deps).
          perl -i -0pe "s/tishlang_core = \\{ path = \"[^\"]+\", features = \\[\"send-values\"\\] \\}/tishlang_core = { version = \"$CORE\", features = [\"send-values\"] }/s" \
            crates/tish_desktop/Cargo.toml

          # Workspace path → versioned (publish order: broker → desktop → app).
          perl -i -0pe "s/tish_broker = \\{ path = \"[^\"]+\" \\}/tish_broker = { version = \"$VERSION\" }/s" \
            crates/tish_desktop/Cargo.toml
          perl -i -0pe "s/tish_desktop = \\{ path = \"[^\"]+\" \\}/tish_desktop = { version = \"$VERSION\" }/s" \
            crates/tish_app/Cargo.toml

          # macOS host (platform-apple): keep the feature + dep, but point tishlang_macos at the
          # PUBLISHED crate (tishlang/tish-apple) instead of the monorepo path. The crate NAME is
          # underscore (tishlang_macos); its directory under tish-apple stays hyphenated.
          perl -i -0pe "s/tishlang_macos = \\{ path = \"[^\"]+\", optional = true \\}/tishlang_macos = { version = \"$APPLE\", optional = true }/s" \
            crates/tish_desktop/Cargo.toml

          # The remaining sibling host path deps (ms/lin/android) are monorepo-only — those repos
          # aren't published yet. Strip them and their feature gates so the crate publishes cleanly;
          # apple is kept (versioned above). Re-add a sibling here once its repo is on crates.io.
          python3 <<'PY'
          from pathlib import Path
          import re
          p = Path("crates/tish_desktop/Cargo.toml")
          text = p.read_text()
          # Drop optional sibling host dependency lines (apple kept — versioned above).
          text = re.sub(
              r'^tish-(ms|lin|android)\s*=\s*\{[^\}]*\}\s*\n',
              "",
              text,
              flags=re.M,
          )
          # Drop feature lines that only enabled those deps (platform-apple kept).
          text = re.sub(
              r'^platform-(ms|lin|android)\s*=\s*\[[^\]]*\]\s*\n',
              "",
              text,
              flags=re.M,
          )
          # Drop feature = ["dep:…"] leftovers if any remain empty.
          p.write_text(text)
          print("--- crates/tish_desktop/Cargo.toml (publish) ---")
          print(p.read_text())
          PY

          # Mirror feature strip on tish_app alias crate (platform-apple kept — forwards to
          # tish_desktop/platform-apple, which is now published).
          python3 <<'PY'
          from pathlib import Path
          import re
          p = Path("crates/tish_app/Cargo.toml")
          text = p.read_text()
          text = re.sub(
              r'^platform-(ms|lin|android)\s*=\s*\[[^\]]*\]\s*\n',
              "",
              text,
              flags=re.M,
          )
          p.write_text(text)
          PY

          grep -E '^(version|name) =|tishlang_core|tish_broker|tish_desktop' \
            crates/tish_broker/Cargo.toml \
            crates/tish_desktop/Cargo.toml \
            crates/tish_app/Cargo.toml

      - name: Publish crates (dependency order)
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          VERSION="${TAG#v}"
          CRATES=(tish_broker tish_desktop tish_app)
          UA="tish-desktop-release/1.0 (https://github.com/tishlang/tish-desktop)"

          # Drift guard: every publishable workspace crate MUST be listed above.
          missing=0
          while IFS= read -r c; do
            printf '%s\n' "${CRATES[@]}" | grep -qx "$c" \
              || { echo "::error::publishable crate '$c' is missing from the CRATES list in crates-release.yml"; missing=1; }
          done < <(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.publish == null or (.publish | length > 0)) | .name')
          [ "$missing" -eq 0 ] || { echo "Add the crate(s) above to CRATES in dependency order, then re-run."; exit 1; }

          publish_with_retry() {
            local crate="$1" max="${PUBLISH_MAX_ATTEMPTS:-6}" attempt log after tgt now wait
            log=$(mktemp)
            for attempt in $(seq 1 "$max"); do
              if cargo publish -p "$crate" --token "$CARGO_REGISTRY_TOKEN" --no-verify --allow-dirty >"$log" 2>&1; then
                cat "$log"; rm -f "$log"; return 0
              fi
              cat "$log"
              if ! grep -qiE '429|too many|rate.?limit|try again (later|after)' "$log"; then
                echo "::error::cargo publish $crate failed (not a rate limit) — see log above"
                rm -f "$log"; return 1
              fi
              after=$(grep -oiE 'try again after [^.]*(GMT|UTC)' "$log" | head -1 | sed -E 's/.*try again after //I' || true)
              wait=""
              if [ -n "$after" ]; then
                now=$(date -u +%s)
                tgt=$(date -u -d "$after" +%s 2>/dev/null || echo "")
                [ -n "$tgt" ] && wait=$(( tgt - now + 5 ))
              fi
              if [ -z "$wait" ] || [ "$wait" -lt 1 ]; then wait=60; fi
              if [ "$wait" -gt 180 ]; then wait=180; fi
              echo "::warning::$crate hit a crates.io rate limit (attempt ${attempt}/${max}); waiting ${wait}s then retrying"
              sleep "$wait"
            done
            echo "::error::$crate still rate-limited after ${max} attempts. Re-dispatch (Actions → Crates.io release → Run workflow, tag=${TAG})."
            rm -f "$log"; return 1
          }

          for crate in "${CRATES[@]}"; do
            if curl -sSf -o /dev/null -A "$UA" "https://crates.io/api/v1/crates/${crate}/${VERSION}"; then
              echo "Skipping $crate v${VERSION} (already published)"
            else
              echo "Publishing $crate v${VERSION} (tishlang_core ${TISHLANG_CORE_VERSION})..."
              publish_with_retry "$crate"
            fi
          done

      - name: Update release description with crates.io URL
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          VERSION="${TAG#v}"
          CRATES_URL="https://crates.io/crates/tish_desktop/${VERSION}"
          RELEASE_ID="${{ github.event.release.id }}"
          REPO="${{ github.repository }}"
          CURRENT_BODY=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${REPO}/releases/${RELEASE_ID}" | jq -r '.body // ""')
          if printf '%s' "$CURRENT_BODY" | grep -q "crates.io/crates/tish_desktop"; then
            echo "Release body already has crates.io link"
          else
            NEW_BODY="${CURRENT_BODY}

          ---
          Published to crates.io: ${CRATES_URL} (also tish_broker, tish_app)"
            curl -s -X PATCH \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/releases/${RELEASE_ID}" \
              -d "$(printf '%s' "$NEW_BODY" | jq -Rs '{body: .}')"
          fi
